# Lockdown gates: every PR and push to main must hold the line on
# strict TS (svelte-check --fail-on-warnings), strict ESLint + prettier,
# unit tests, and a production build. Playwright e2e/parity runs locally
# against prod (see AGENTS.md) — not here, to keep CI fast and browser-free.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # Public Sanity project/dataset (not secrets). The build prerenders every
      # page from the public dataset, so it needs these to fetch content.
      VITE_SANITY_PROJECT_ID: elspywtm
      VITE_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install (frozen)
        run: pnpm install --frozen-lockfile

      - name: typecheck (svelte-check, zero warnings)
        run: pnpm check

      - name: lint (prettier + eslint strict type-checked)
        run: pnpm lint

      - name: unit tests (vitest)
        run: pnpm test

      - name: build (vite production)
        run: pnpm build
